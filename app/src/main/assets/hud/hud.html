<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=600, initial-scale=1"><meta name="referrer" content="no-referrer"><title>DejaLango lens</title>
<style>
:root { color-scheme: dark; --green:#8cff9d; --dim:rgba(140,255,157,.72); }
* { box-sizing:border-box } html,body { margin:0; width:600px; height:600px; overflow:hidden; background:transparent; color:var(--green); font-family:Roboto,system-ui,sans-serif }
#lens { width:600px; height:600px; padding:24px 30px; display:flex; flex-direction:column; gap:14px }
#status { font-size:20px; line-height:1.3; min-height:26px } #receipt { font-size:18px; line-height:1.4 } #receiptRoman { font-size:18px; line-height:1.4 }
#heard { font-size:25px; line-height:1.35; max-height:72px; overflow:hidden } #meaning,#heardRoman { font-size:18px; line-height:1.35; color:var(--dim) }
#word { font-size:32px; line-height:1.35; min-height:44px } #wordRoman,#wordMeaning { font-size:20px }
#reply { flex:1; display:flex; flex-direction:column; justify-content:center; gap:8px; min-height:0 }
#replyText { font-size:32px; line-height:1.3; max-height:170px; overflow:hidden } #roman { font-size:22px; line-height:1.4; max-height:64px; overflow:hidden } #back { font-size:18px; line-height:1.4; color:var(--dim); max-height:50px; overflow:hidden }
#position,#error { font-size:17px; line-height:1.35 } #keys { font-size:14px; color:var(--dim) } #connection { position:absolute; inset:0; display:grid; place-items:center; color:var(--green); font-size:22px; padding:40px; text-align:center; background:transparent }
.hidden,[hidden] { display:none!important } html.embedded #keys { display:none }
</style></head><body>
<main id="lens" aria-label="Glasses display">
<div id="status" role="status"></div><div><div id="receipt"></div><div id="receiptRoman"></div></div>
<div><div id="heard"></div><div id="heardRoman"></div><div id="meaning"></div></div>
<div><div id="word"></div><div id="wordRoman"></div><div id="wordMeaning"></div></div>
<div id="reply"><div id="position"></div><div id="replyText"></div><div id="roman"></div><div id="back"></div></div>
<div id="error"></div><div id="keys">T Talk · C Done · ← → browse · P pause display · S flip · U Undo</div>
</main><div id="connection" role="status">Open the current HUD link from the phone.</div>
<script src="/hud.js"></script></body></html>
