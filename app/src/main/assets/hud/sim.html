<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DejaLango · lens simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#142936;color:#e1f0f8;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}h1{font-size:20px;margin:0}p{margin:0;max-width:60ch;line-height:1.5}.frame{position:relative;width:min(600px,90vw);aspect-ratio:1;overflow:hidden;border-radius:24px;background:#000}.scene,video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.5)}iframe{pointer-events:none;position:absolute;inset:0;width:600px;height:600px;border:0;background:transparent;mix-blend-mode:screen;transform-origin:top left}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:660px}button{min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid #8ca9ba;background:#244e7b;color:#e1f0f8;font:inherit;font-weight:600}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #b3dbc0;outline-offset:3px}#note{font-size:14px;color:#b7cdda}
</style></head><body><h1>Your glasses · simulator</h1><p id="note">600 × 600 additive green layer over a synthetic café scene. This is a display simulation, not an optical or latency measurement.</p>
<div class="frame" id="frame"><img class="scene" src="/cafe.webp" alt="Synthetic café background"><iframe id="hud" title="Glasses display" tabindex="-1"></iframe></div>
<div class="controls"><button id="talk" disabled>I’m talking · T</button><button id="done" disabled>Done · C</button><button id="prev">Previous</button><button id="next">Next</button><button id="pause">Pause display · P</button><button id="camera">Use my camera</button></div><p id="status" role="status">Open the current tokenized simulator link from the phone.</p>
<script>
(() => {
const params=new URLSearchParams(location.search), iframe=document.getElementById('hud'), frame=document.getElementById('frame');let currentState;
iframe.src='/hud?embedded=1&token='+encodeURIComponent(params.get('token')||'');
if(params.get('bg')==='black') document.querySelector('.scene').remove();
const resize=()=>{iframe.style.transform='scale('+frame.clientWidth/600+')';};new ResizeObserver(resize).observe(frame);resize();
const send=(action,extra)=>iframe.contentWindow.postMessage({type:'companion-action',action,extra},location.origin);
['talk','done','prev','next','pause'].forEach(action=>document.getElementById(action).onclick=()=>send(action));
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==iframe.contentWindow||!e.data||e.data.type!=='companion-state')return;const s=currentState=e.data.state;document.getElementById('talk').disabled=!(s.listening&&s.modelReady&&s.capture.ready);document.getElementById('done').disabled=!(s.listening&&s.capture.mine&&s.capture.phase!=='FINISHING');document.getElementById('pause').textContent=s.paused?'Resume display · P':'Pause display · P';document.getElementById('status').textContent=s.synthetic?'Synthetic model or walkthrough state':'Connected to your local session';});
document.addEventListener('keydown',e=>{if(e.repeat)return;const key=e.key.toLowerCase();const a={t:'talk',c:'done',p:'pause',arrowup:'talk',arrowleft:'prev',arrowright:'next'}[key];if(a){send(a);e.preventDefault();}else if(key==='s'&&currentState&&currentState.latestLineId!==null){send('flip',{lineId:currentState.latestLineId});e.preventDefault();}else if(key==='u'&&currentState&&currentState.correction){send('undo',{correctionId:currentState.correction.id});e.preventDefault();}});
document.getElementById('camera').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});const video=document.createElement('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.srcObject=stream;frame.prepend(video);document.querySelector('.scene')?.remove();document.getElementById('camera').disabled=true;document.getElementById('note').textContent='Local camera preview with an additive display layer. No video is sent to the phone.';}catch(_){document.getElementById('status').textContent='Camera unavailable. The synthetic scene remains available.';}};
})();</script></body></html>
